<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaypointFlit CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef1f7;color:#102040;font:16px/1.5 Heebo,system-ui,sans-serif;text-align:center}
a{color:#d8541a;font-weight:600}
</style>
</head>
<body>
<div id="app">טוען…</div>
<script type="module">
import { requireUser, logout } from "./auth-guard.js";
const me = await requireUser();
document.getElementById("app").innerHTML = `
  <div>
    <h1>✈️ WaypointFlit CRM</h1>
    <p>שלב 1 הושלם: התחברת בתור <b>${me.name}</b> (${me.role === "admin" ? "מנהל" : me.role === "staff" ? "צוות" : "צפייה"}).</p>
    <p>מסך הלידים המלא נבנה בשלב הבא.</p>
    ${me.role === "admin" ? '<p><a href="admin.html">מסך ניהול משתמשים →</a></p>' : ""}
    <p><a href="#" id="out">התנתקות</a></p>
  </div>`;
document.getElementById("out").addEventListener("click", e => { e.preventDefault(); logout(); location.href = "login.html"; });
</script>
</body>
</html>
